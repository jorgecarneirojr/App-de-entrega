services:
  postgres:
    image: postgres:16-alpine
    container_name: pi2_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pi2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-delivery_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: pi2_backend
    environment:
      APP_NAME: Delivery API
      API_V1_PREFIX: /api/v1
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-delivery_db}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-https://p2.carneirojunior.com.br}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    container_name: pi2_frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3100:3000"
    restart: unless-stopped

volumes:
  pi2_postgres_data:
